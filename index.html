<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>我的第個雲端網頁</title>
</head>
<body>
  <h1>hello Cloud Computing! 4130E026趙文香</h1>
  <p>這是我的第一次把檔案放到雲端司服器上共全世界存取!</p>

    <h2>請輸入個人資料</h2>

    <form>
        <label>姓名：</label>
        <input type="text" name="name" placeholder="請輸入姓名">
        <br><br>

        <label>年齡：</label>
        <input type="number" name="age" placeholder="請輸入年齡">
        <br><br>

        <label>性別：</label>
        <input type="radio" name="gender" value="男"> 男
        <input type="radio" name="gender" value="女"> 女
        <input type="radio" name="gender" value="其他"> 其他
        <br><br>

        <label>電話：</label>
        <input type="tel" name="phone" placeholder="請輸入電話號碼">
        <br><br>

        <label>地址：</label>
        <input type="text" name="address" placeholder="請輸入地址">
        <br><br>

        <input type="submit" value="送出">
        <input type="reset" value="清除">

    </form>
